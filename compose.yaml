services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudlink
      POSTGRES_USER: cloudlink
      POSTGRES_PASSWORD: cloudlink_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cloudlink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlink -d cloudlink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cloudlink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cloudlink_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cloudlink_postgres_data:
  cloudlink_redis_data:
